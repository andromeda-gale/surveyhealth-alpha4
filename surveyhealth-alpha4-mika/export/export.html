<!DOCTYPE html>
<!-- Mika Montemayor's work -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SurveyHealth - Export</title>
    <link rel="stylesheet" href="export-styling.css">
    <script src="export-functions.js" defer></script>
</head>
<body>
    <header class="headerdiv">
        <nav class="navigation">
            <div class="hamburgerbox" role="button" tabindex="0"
                 aria-label="Open navigation menu" aria-expanded="false"
                 onclick="change(this)" onkeydown="hamburgerKey(event, this)">
                <div class="hamline1"></div>
                <div class="hamline2"></div>
                <div class="hamline3"></div>
            </div>

            <ul class="dropdown">
                <li><a href="landing.html">Profile</a></li>
                <li><a href="placeholder.html">Calendar</a></li>
                <li><a href="placeholder.html">About Us</a></li>
                <li><a href="placeholder.html">Contact Us</a></li>
                <li><a href="placeholder.html">FAQ</a></li>
                <li><a href="placeholder.html">Privacy</a></li>
                <li><a href="placeholder.html">Settings</a></li>
                <li><a href="placeholder.html">Log Out</a></li>
            </ul>
        </nav>

        <a class="profile-link" href="landing.html" aria-label="Go to profile page">
            <img class="profileimage" src="profileimages/patientprofile.png"
                 alt="Profile" onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';">
            <span class="profile-fallback" aria-hidden="true">SP</span>
        </a>
    </header>

    <main class="page-layout">
        <section class="export-panel">
            <h1>Export from:</h1>
            <div class="date-range">
                <label class="visually-hidden" for="startDate">Start date</label>
                <input id="startDate" type="text" placeholder="MM/DD/YYYY"
                       inputmode="numeric" autocomplete="off">
                <span class="date-arrow">→</span>
                <label class="visually-hidden" for="endDate">End date</label>
                <input id="endDate" type="text" placeholder="MM/DD/YYYY"
                       inputmode="numeric" autocomplete="off">
            </div>

            <h2>Send to:</h2>
            <label class="consent-row">
                <input type="checkbox" id="consent">
                <span>I have signed the <a href="placeholder.html">HIPAA disclosure statement</a>
                and consent to sharing data with the people or entities listed below:</span>
            </label>

            <div class="recipient" id="recipient" hidden>
                <div class="recipient-avatar">TP</div>
                <div>
                    <strong>Dr. Thera Py</strong>
                    <span>thera.py@healthserv.ya</span>
                </div>
            </div>
            <button class="add-recipient" id="addRecipient" type="button">＋ Add Recipient</button>

            <h2 class="include-title">Include:</h2>
            <div class="include-options">
                <label><input type="checkbox" class="include-check" value="Mood Calendar"><span>Mood Calendar</span></label>
                <label><input type="checkbox" class="include-check" value="Profile information"><span>Profile information</span></label>
                <label><input type="checkbox" class="include-check" value="Comments"><span>Comments</span></label>
            </div>

            <fieldset class="format-choice">
                <legend>Export as</legend>
                <label><input type="radio" name="fileType" value="pdf" checked> PDF</label>
            </fieldset>

            <div class="action-buttons">
                <button class="back-button" type="button" onclick="goBack()">Back</button>
                <button class="export-button" type="button" onclick="exportBlankPDF()">Export</button>
            </div>
        </section>

        <section class="preview-section">
            <h2>Preview</h2>
            <div class="preview-box">
                <div class="preview-heading">
                    <span id="pageCount">Pg 1/1</span>
                    <span class="preview-note">Preview updates as you select sections</span>
                </div>
                <iframe id="pdfPreview" title="SurveyHealth PDF preview"></iframe>
            </div>
        </section>
    </main>

    <footer class="footerdiv">
        <p>Issues? <a href="placeholder.html">Contact Us!</a></p>
    </footer>
</body>
</html>
